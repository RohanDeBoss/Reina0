<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HeXO Local</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="setupOverlay" class="setup-overlay">
      <form id="setupForm" class="setup-dialog">
        <div class="eyebrow">New Game</div>
        <h1>HeXO</h1>

        <label class="field">
          <span>Mode</span>
          <select id="setupMode">
            <option value="human-ai">Human vs AI</option>
            <option value="human-human">Human vs Human</option>
            <option value="ai-ai">AI vs AI</option>
          </select>
        </label>

        <div id="humanSideField" class="field-row">
          <label class="field">
            <span>Human side</span>
            <select id="setupHumanColor">
              <option value="blue">Blue</option>
              <option value="orange">Orange</option>
            </select>
          </label>
          <label class="field">
            <span>First move</span>
            <select id="setupFirstColor">
              <option value="blue">Blue</option>
              <option value="orange">Orange</option>
            </select>
          </label>
        </div>

        <div class="engine-setup-grid">
          <section>
            <h2>Blue Engine</h2>
            <label class="field">
              <span>Depth <b id="blueDepthValue">3</b></span>
              <input id="blueDepthInput" type="range" min="1" max="8" value="3">
            </label>
            <label class="field">
              <span>Time limit seconds</span>
              <input id="blueTimeInput" type="number" min="0" max="300" step="1" value="0">
            </label>
          </section>
          <section>
            <h2>Orange Engine</h2>
            <label class="field">
              <span>Depth <b id="orangeDepthValue">3</b></span>
              <input id="orangeDepthInput" type="range" min="1" max="8" value="3">
            </label>
            <label class="field">
              <span>Time limit seconds</span>
              <input id="orangeTimeInput" type="number" min="0" max="300" step="1" value="0">
            </label>
          </section>
        </div>

        <label id="ponderRow" class="check-row setup-check">
          <input id="setupPonderToggle" type="checkbox">
          <span>Ponder analysis in Human vs Human</span>
        </label>

        <label class="check-row setup-check">
          <input id="setupAutoAiToggle" type="checkbox" checked>
          <span>Auto-play AI turns</span>
        </label>

        <div class="setup-actions">
          <button id="startGameButton" class="primary" type="submit">Play</button>
        </div>
      </form>
    </div>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">H</div>
        <div>
          <div class="brand-name">HeXO</div>
          <div class="brand-subtitle">Infinite Hex Tic-Tac-Toe</div>
        </div>
      </div>
      <div class="turn-pill">
        <span id="turnDot" class="dot blue"></span>
        <span id="turnText">Loading</span>
      </div>
      <div class="top-actions">
        <button id="undoButton" type="button">Undo</button>
        <button id="redoButton" type="button">Redo</button>
        <button id="botButton" type="button">AI Move</button>
        <button id="newGameButton" class="primary" type="button">New Game</button>
      </div>
    </header>

    <main class="app-shell">
      <section class="board-wrap" aria-label="HeXO board">
        <canvas id="boardCanvas"></canvas>
        <div class="board-banner" id="boardBanner">
          <div id="bannerTitle">Ready</div>
          <div id="bannerSub">Open New Game to choose a mode.</div>
        </div>
        <div class="coord-readout" id="coordReadout">0, 0</div>
        <div class="toast" id="toast" hidden></div>
      </section>

      <aside class="side-panel">
        <section class="panel status-panel">
          <div class="eyebrow" id="modeLabel">Setup</div>
          <h1 id="statusTitle">No Game Started</h1>
          <div class="quick-stats">
            <div><span>Cells</span><strong id="cellsStat">0</strong></div>
            <div><span>Turn</span><strong id="turnStat">1</strong></div>
            <div><span>Eval</span><strong id="scoreStat">-</strong></div>
          </div>
        </section>

        <section class="panel engine-panel">
          <div class="history-header">
            <h2>Engine</h2>
            <span id="engineStatus" class="engine-badge">Idle</span>
          </div>
          <div class="engine-summary">
            <div><span>Side</span><strong id="engineSide">-</strong></div>
            <div><span>Depth</span><strong id="engineDepth">D0</strong></div>
            <div><span>Time</span><strong id="engineTime">0 ms</strong></div>
            <div><span>Nodes</span><strong id="engineNodes">0</strong></div>
            <div><span>NPS</span><strong id="engineNps">-</strong></div>
          </div>
          <div class="pv-box">
            <div class="pv-header">
              <span>PV</span>
              <span class="pv-hint">Hover a move to preview on board</span>
            </div>
            <div id="enginePv" class="pv-moves"><span class="pv-empty">-</span></div>
          </div>
          <div id="engineDepths" class="engine-depths"></div>
          <!-- analyzeControls: hidden automatically in ponder mode or ai-ai (analysis is automatic) -->
          <div id="analyzeControls" class="analyze-controls">
            <button id="analyzeButton" type="button">Analyze</button>
            <label class="check-row">
              <input id="infiniteAnalysisToggle" type="checkbox">
              <span>Infinite analysis loop</span>
            </label>
          </div>
        </section>

        <section class="panel">
          <h2>Move</h2>
          <div class="selected-row" id="selectedCells">
            <span class="empty-selection">No cells selected</span>
          </div>
          <div class="button-grid">
            <button id="commitButton" class="primary" type="button">Place Cells</button>
            <button id="clearSelectionButton" type="button">Clear</button>
          </div>
          <label class="check-row">
            <input id="autoSubmitToggle" type="checkbox" checked>
            <span>Place after two clicks</span>
          </label>
          <label class="check-row">
            <input id="autoAiToggle" type="checkbox" checked>
            <span>Auto-play AI turns</span>
          </label>
        </section>

        <section class="panel">
          <h2>Board</h2>
          <label class="field">
            <span>Hex size <b id="sizeValue">34</b></span>
            <input id="sizeSlider" type="range" min="20" max="52" value="34">
          </label>
          <div class="toggle-grid">
            <label class="check-row">
              <input id="coordsToggle" type="checkbox">
              <span>Coordinates</span>
            </label>
            <label class="check-row">
              <input id="frontierToggle" type="checkbox" checked>
              <span>Legal frontier</span>
            </label>
            <label class="check-row">
              <input id="heatToggle" type="checkbox">
              <span>Threat tint</span>
            </label>
            <label class="check-row">
              <input id="latestToggle" type="checkbox" checked>
              <span>Latest move</span>
            </label>
          </div>
          <div class="button-grid">
            <button id="resetViewButton" type="button">Reset View</button>
            <button id="centerPiecesButton" type="button">Center Pieces</button>
          </div>
        </section>

        <section class="panel history-panel">
          <div class="history-header">
            <h2>History</h2>
            <button id="undoRoundButton" type="button">Undo Round</button>
          </div>
          <div id="historyList" class="history-list"></div>
        </section>
      </aside>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
